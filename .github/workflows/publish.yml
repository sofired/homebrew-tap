# Publish the bottles a pull request built. `brew pr-pull` downloads the
# artifacts tests.yml uploaded, pushes the bottles to the `bottles` release on
# this repo, commits the `bottle do` block on top of the PR's commits, and
# pushes the result to main.
#
# Dispatch only, never on a PR event: whoever runs this decides that the PR's
# formula is fit to ship. The composemux release workflow dispatches it for its
# own version bumps once the PR's checks are green.
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Reviewed pull request head commit SHA (must match the current PR head)
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # Always pin the reviewed head. brew pr-pull fails if the PR head has
          # moved since head_sha, so a push landed after review can't slip a
          # different commit into the published bottles (TOCTOU, CWE-367). That
          # is why head_sha is a required input, with no unpinned fallback.
          brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" \
            --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          branch: main

      # pr-pull cherry-picks rather than merges. GitHub marks the PR merged only
      # when the picked commits kept their SHAs (a fast-forward), so close it
      # ourselves otherwise, and drop the branch when it lives in this repo.
      - name: Close the pull request if the push did not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          read -r state cross < <(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository --jq '"\(.state) \(.isCrossRepository)"')
          if [[ "$state" == "OPEN" ]]
          then
            args=()
            [[ "$cross" == "false" ]] && args+=(--delete-branch)
            gh pr close "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
              --comment "Landed on main by brew pr-pull, with bottles."
          fi
