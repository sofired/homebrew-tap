# Publish the bottles a pull request built. `brew pr-pull` downloads the
# artifacts tests.yml uploaded, pushes the bottles to the `bottles` release on
# this repo, commits the `bottle do` block on top of the PR's commits, and
# pushes the result to main.
#
# Dispatch only, never on a PR event: whoever runs this decides that the PR's
# formula is fit to ship. The composemux release workflow dispatches it for its
# own version bumps once the PR's checks are green.
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Reviewed pull request head commit SHA (must match the current PR head)
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    # The publisher app's key lives in this environment, which only main can
    # deploy to, so no other branch's copy of a workflow can read it.
    environment: publish
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      # main's ruleset requires pull requests and the brew test-bot checks, which
      # pr-pull's own commit (the `bottle do` block) doesn't have. GITHUB_TOKEN
      # can't be a ruleset bypass, so git runs as the publisher app, which is.
      # Its token is limited to this repository and contents: write, and expires
      # with the job. It goes to setup-homebrew, whose git auth header the push
      # then uses: one git credential for the whole job, never two headers.
      # brew's API work (artifacts, the bottles release) and closing the pull
      # request still use GITHUB_TOKEN, as their steps say.
      - name: Get the publisher app's token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # Always pin the reviewed head. brew pr-pull fails if the PR head has
          # moved since head_sha, so a push landed after review can't slip a
          # different commit into the published bottles (TOCTOU, CWE-367). That
          # is why head_sha is a required input, with no unpinned fallback.
          brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" \
            --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          branch: main

      # pr-pull cherry-picks rather than merges. GitHub marks the PR merged only
      # when the picked commits kept their SHAs (a fast-forward), so close it
      # ourselves otherwise, and drop the branch when it lives in this repo.
      - name: Close the pull request if the push did not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          read -r state cross < <(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository --jq '"\(.state) \(.isCrossRepository)"')
          if [[ "$state" == "OPEN" ]]
          then
            args=()
            [[ "$cross" == "false" ]] && args+=(--delete-branch)
            gh pr close "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
              --comment "Landed on main by brew pr-pull, with bottles."
          fi
