name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        # One macOS bottle, built on the oldest macOS Homebrew still supports.
        # Homebrew serves a bottle built on an older macOS to newer ones (see
        # `find_older_compatible_tag` in brew), so arm64_sequoia covers Sequoia,
        # Tahoe and later. Intel macOS is Tier 3 from September 2026 and is not
        # built.
        os: [macos-15]
        include:
          # Linux bottles carry no OS version. Both run in Homebrew's own image,
          # which is published for amd64 and arm64.
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Build, test and bottle every formula the PR changes. The root URL is
      # where `brew pr-pull` (publish.yml) uploads the bottles and what the
      # committed `bottle do` block points at: one GitHub Release on this repo,
      # tagged `bottles`, holding every bottle. Bottle file names carry the
      # formula, version, rebuild and platform, so they never collide.
      #
      # PRs only. Everything reaches main through a PR, and the commit that
      # pr-pull pushes is made with GITHUB_TOKEN, which does not trigger
      # workflows.
      - run: brew test-bot --only-formulae --root-url=https://github.com/sofired/homebrew-tap/releases/download/bottles
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
